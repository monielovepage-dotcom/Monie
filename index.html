<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ไปลอยกระทงด้วยกันไหม?</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fb1;--pink-soft:#ffe3ec;--cream:#fff6f3;--brown:#5a3a32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#fff;color:var(--brown);font-family:'Mali','Itim','Noto Sans Thai',sans-serif;
display:flex;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden;padding:24px 14px}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dot{position:absolute;border-radius:50%;background:#ffc2d4;animation:tw 3.5s ease-in-out infinite}
.spark{position:absolute;color:#ffb3c9;animation:tw 3s ease-in-out infinite}
.burst{position:absolute;width:54px;height:54px;border-radius:50%;
background:repeating-conic-gradient(#ffb3c9 0 7deg,transparent 7deg 45deg);
-webkit-mask:radial-gradient(circle,transparent 34%,#000 36%,#000 70%,transparent 72%);
mask:radial-gradient(circle,transparent 34%,#000 36%,#000 70%,transparent 72%);
animation:burst 4s ease-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes burst{0%{transform:scale(.2);opacity:0}25%{opacity:.9}100%{transform:scale(1.3);opacity:0}}

.wrap{position:relative;width:min(100%,400px);display:flex;flex-direction:column;align-items:center;z-index:1}
.wrap.shake{animation:shake .48s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{0%,100%{transform:translate(0)}10%{transform:translate(-10px,3px) rotate(-1.2deg)}25%{transform:translate(9px,-4px) rotate(1deg)}40%{transform:translate(-7px,2px) rotate(-.7deg)}55%{transform:translate(5px,-2px)}70%{transform:translate(-3px,1px)}85%{transform:translate(2px,0)}}
.catwrap{position:relative;z-index:3;display:block;margin:0 auto -12px;line-height:0;cursor:pointer;transform:scale(var(--sz,1));transform-origin:50% 100%;transition:transform .45s cubic-bezier(.34,1.56,.64,1);-webkit-tap-highlight-color:transparent}
.pose{position:absolute;opacity:0;transform-origin:50% 100%;transform:translateY(8px) scale(.95);transition:opacity .28s ease,transform .45s cubic-bezier(.34,1.56,.64,1)}
.pose.on{opacity:1;transform:none}
.pose img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.catwrap.swing .pose{animation:swing .72s both}
@keyframes swing{0%{transform:none}22%{transform:rotate(-9deg) translate(-8px,3px) scale(1.02);animation-timing-function:cubic-bezier(.5,0,.2,1)}42%{transform:rotate(12deg) translate(12px,7px) scale(1.07);animation-timing-function:ease-out}65%{transform:rotate(-3deg) translate(-2px,0)}100%{transform:none}}
.catwrap.jump .pose{animation:jump .8s ease-in-out 2}
@keyframes jump{0%{transform:none}14%{transform:scale(1.06,.9)}45%{transform:translateY(-34px) scale(.96,1.06)}72%{transform:translateY(0) scale(1.05,.94)}86%{transform:translateY(-6px) scale(.99,1.01)}100%{transform:none}}
.catwrap.boop .pose{animation:boop .3s ease-out}
@keyframes boop{0%{transform:none}40%{transform:scale(1.08,.9)}100%{transform:none}}
.bubble{position:absolute;left:50%;top:6px;z-index:4;transform:translate(-50%,-100%) scale(.8);background:#fff;border:2px solid var(--brown);border-radius:14px;padding:5px 12px;font-size:15px;line-height:1.4;white-space:nowrap;opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.anger{position:absolute;right:8px;top:4px;z-index:4;opacity:0;pointer-events:none;line-height:1}
.anger.on{animation:ang .7s ease-out}
@keyframes ang{0%{opacity:0;transform:scale(.3) rotate(-20deg)}30%{opacity:1;transform:scale(1.3) rotate(8deg)}100%{opacity:0;transform:scale(1) rotate(0)}}
.fs{position:fixed;inset:0;z-index:9;pointer-events:none;overflow:hidden}
.fs::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.9),rgba(255,214,228,.55) 60%,transparent 85%);animation:fsflash .5s ease-out forwards}
@keyframes fsflash{0%{opacity:0}20%{opacity:.85}100%{opacity:0}}
.sl{position:absolute;inset:0;filter:drop-shadow(0 0 7px rgba(255,111,145,.75));animation:fsin 1.7s ease-out both}
.sl svg{width:100%;height:100%;display:block}
@keyframes fsin{0%{clip-path:inset(0 100% 0 0);opacity:1}9%{clip-path:inset(0 0 0 0);opacity:1}40%{clip-path:inset(0 0 0 0);opacity:.9}100%{clip-path:inset(0 0 0 0);opacity:0}}
.wrap.shake2{animation:shake2 .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake2{0%,100%{transform:translate(0)}10%{transform:translate(-18px,6px) rotate(-2.2deg)}25%{transform:translate(16px,-8px) rotate(2deg)}40%{transform:translate(-13px,4px) rotate(-1.4deg)}55%{transform:translate(9px,-4px)}70%{transform:translate(-5px,2px)}85%{transform:translate(3px,0)}}
.hp{font-size:15px;letter-spacing:2px;color:var(--pink);font-weight:700;margin-right:auto;line-height:1}
.hp .lost{color:#ecd3da}.hp .pop{display:inline-block;animation:hpop .55s}
@keyframes hpop{40%{transform:scale(1.8) rotate(-15deg)}100%{transform:scale(1)}}
.wb{display:flex;gap:6px}
.snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:6;width:38px;height:38px;border-radius:50%;border:2px solid var(--brown);background:#fff;font-size:17px;cursor:pointer}
.halfwrap{height:40px;overflow:hidden;display:flex;justify-content:center;gap:4px}
.half{display:inline-block;font-weight:700;font-size:24px;color:var(--pink);animation:fall 1s ease-in forwards}
.half.l{--r:-25deg;--x:-16px}.half.r{--r:30deg;--x:16px;animation-delay:.12s}
@keyframes fall{0%{transform:none}100%{transform:translate(var(--x),46px) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
.card{position:relative;z-index:1;width:100%;background:var(--cream);border:3px solid var(--brown);border-radius:18px;
box-shadow:0 6px 0 rgba(90,58,50,.12),0 12px 26px rgba(255,143,177,.28);overflow:hidden}
.bar{height:30px;background:var(--pink-soft);border-bottom:2px solid var(--brown);display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 10px}
.bar i{width:14px;height:14px;border:2px solid var(--brown);border-radius:4px;background:#fff}
.body{padding:26px 20px 24px;text-align:center;min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.body{overflow:hidden;transition:height .34s cubic-bezier(.4,0,.2,1),opacity .17s ease}
.body.out{opacity:0}
.body.pop{animation:pop .4s cubic-bezier(.34,1.3,.64,1)}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.97)}100%{opacity:1;transform:none}}
h1{font-size:clamp(22px,6.4vw,28px);margin:0;line-height:1.4}
p{margin:0;font-size:clamp(16px,4.6vw,19px);line-height:1.6}
.btns{display:flex;gap:12px}
.btn{flex:1;font:inherit;font-size:20px;font-weight:700;padding:12px 8px;border:3px solid var(--brown);border-radius:12px;cursor:pointer;color:var(--brown);
box-shadow:0 4px 0 var(--brown);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--brown)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}
.yes{background:var(--pink);color:#fff}
.no{background:var(--pink-soft)}
.pill{display:inline-block;margin:0 auto;padding:8px 16px;border:2px solid var(--brown);border-radius:999px;background:var(--pink-soft);font-weight:700;font-size:clamp(15px,4.4vw,18px)}
.link{background:none;border:none;font:inherit;font-size:15px;color:var(--brown);text-decoration:underline;cursor:pointer;opacity:.7}
.slash{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.slash b{position:absolute;left:-10%;width:120%;height:12px;border-radius:8px;transform-origin:left center;
background:linear-gradient(90deg,transparent,var(--pink),#fff,var(--pink),transparent);box-shadow:0 0 0 2px #fff;animation:cut .5s cubic-bezier(.2,.8,.25,1) forwards}
.slash b:nth-child(1){top:38%;--r:-22deg}
.slash b:nth-child(2){top:62%;--r:-17deg;animation-delay:.12s;opacity:0}
@keyframes cut{0%{transform:rotate(var(--r)) scaleX(0);opacity:1}55%{transform:rotate(var(--r)) scaleX(1);opacity:1}100%{transform:rotate(var(--r)) scaleX(1);opacity:0}}
.heart{position:fixed;bottom:-30px;z-index:5;color:var(--pink);pointer-events:none;animation:rise ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.5) rotate(0);opacity:0}12%{opacity:1}30%{transform:translate(calc(var(--dx)*.6),-30vh) scale(.9) rotate(-8deg)}60%{transform:translate(calc(var(--dx)*-.5),-62vh) scale(1) rotate(8deg);opacity:1}100%{transform:translate(var(--dx),-108vh) scale(1.1) rotate(0);opacity:0}}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<button class="snd" id="snd" aria-label="เปิด/ปิดเสียง">🔊</button>
<main class="wrap" id="wrap">
  <div class="catwrap" id="catwrap" role="img" aria-label="แมวน้อยถือมีดการ์ตูน"></div>
  <section class="card" id="card">
    <div class="bar"><span class="hp" id="hp"></span><span class="wb"><i></i><i></i><i></i></span></div>
    <div class="body" id="body"></div>
  </section>
</main>

const cat = document.getElementById('catwrap'), body = document.getElementById('body'),
      wrap = document.getElementById('wrap'), card = document.getElementById('card');
/* cat poses are stacked and cross-faded; every pose is bottom-aligned on the card edge */
const SRC = USE_EMBEDDED ? EMBEDDED : ASSETS;
const stageW = 270, stageH = 200, poseEls = {}, poseImg = {};
cat.style.width = stageW + 'px'; cat.style.height = stageH + 'px';
Object.keys(DIM).forEach(k => {
  const D = DIM[k], d = document.createElement('div'), im = new Image();
  d.className = 'pose'; d.style.left = (stageW - D.w * D.s) / 2 + 'px'; d.style.bottom = -(D.h - D.b) * D.s + 'px';
  im.src = SRC[k]; im.width = D.w * D.s; im.height = D.h * D.s; im.alt = ''; im.draggable = false;
  d.appendChild(im); cat.appendChild(d); poseEls[k] = d; poseImg[k] = im;
});
const bubble = document.createElement('div'); bubble.className = 'bubble'; cat.appendChild(bubble);
const angerEl = document.createElement('div'); angerEl.className = 'anger'; angerEl.textContent = '💢'; cat.appendChild(angerEl);
let current = '';
function setCat(s) {
  if (s === current) return; current = s;
  const im = poseImg[s]; im.removeAttribute('src'); void im.offsetWidth; im.src = SRC[s];   // restart the GIF from frame 1
  Object.keys(poseEls).forEach(k => poseEls[k].classList.toggle('on', k === s));
}
let tok = 0;
function show(html, cb) {   // fade out -> animate card height -> fade/pop in
  const t = ++tok;
  if (!body.firstChild) { body.innerHTML = html; cb && cb(); return; }
  const h0 = body.offsetHeight; body.style.height = h0 + 'px'; body.classList.add('out');
  setTimeout(() => {
    if (t !== tok) return;
    body.innerHTML = html; cb && cb(); body.style.height = 'auto'; const h1 = body.offsetHeight;
    body.style.height = h0 + 'px'; void body.offsetHeight; body.style.height = h1 + 'px';
    body.classList.remove('out', 'pop'); void body.offsetWidth; body.classList.add('pop');
    setTimeout(() => { if (t === tok) body.style.height = ''; }, 380);
  }, 170);
}
const pulse = (el, c, ms) => { el.classList.remove(c); void el.offsetWidth; el.classList.add(c); setTimeout(() => el.classList.remove(c), ms); };

/* ---- sound (tiny WebAudio synth, toggle with the button) ---- */
let ac, soundOn = true;
const AC = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
function tone(f1, f2, dur, type, g, t0) {
  if (!soundOn) return;
  try { const c = AC(), t = c.currentTime + (t0 || 0), o = c.createOscillator(), v = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    v.gain.setValueAtTime(g || .12, t); v.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(v); v.connect(c.destination); o.start(t); o.stop(t + dur + .02); } catch (e) {}
}
function whoosh() {
  if (!soundOn) return;
  try { const c = AC(), len = c.sampleRate * .25, b = c.createBuffer(1, len, c.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < len; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), v = c.createGain(), t = c.currentTime;
    f.type = 'bandpass'; f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(4500, t + .22); v.gain.value = .35;
    s.buffer = b; s.connect(f); f.connect(v); v.connect(c.destination); s.start(t); } catch (e) {}
}
const sfx = {
  slash() { whoosh(); tone(900, 200, .2, 'sawtooth', .05); setTimeout(() => tone(180, 60, .3, 'square', .09), 110); },
  poke() { tone(500 + Math.random() * 300, 950, .09, 'sine', .14); },
  yes() { [660, 880, 1100, 1320].forEach((f, i) => tone(f, f * 1.01, .2, 'triangle', .12, i * .09)); },
  over() { [440, 330, 220].forEach((f, i) => tone(f, f * .9, .25, 'square', .07, i * .18)); }
};
document.getElementById('snd').addEventListener('click', e => { soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊' : '🔇'; if (soundOn) sfx.poke(); });

/* ---- game state ---- */
const MAXHP = 5, hpEl = document.getElementById('hp');
let busy = false, n = 0, hp = MAXHP, pokes = 0, bt;
function hpRender(pop) {
  hpEl.innerHTML = Array.from({ length: MAXHP }, (_, i) => `<span class="${i >= hp ? 'lost' : ''}${i === pop ? ' pop' : ''}">♥</span>`).join('');
}
function say(t, ms) { bubble.textContent = t; bubble.classList.add('on'); clearTimeout(bt); bt = setTimeout(() => bubble.classList.remove('on'), ms || 1300); }
const TRANSIENT = ['หืม?! ไม่ไปเหรอ?! 😾', 'อีกแล้วเหรอ?!', 'ฮึ่ม!! ไม่ฟังเลยนะ', 'ก็บอกให้ไปไง!!!', 'แมวหมดความอดทนแล้ว!!!'];
const POPUP = ['โดนฟันแล้ว!<br>คราวหน้าห้ามปฏิเสธอีกนะ ♡', 'ครั้งที่ 2 แล้วนะ…<br>ปุ่มไม่ไปเริ่มเล็กลงแล้วน้า ♡', 'จะหนีเหรอ!?<br>ปุ่มไม่ไปก็เริ่มหนีแล้วนะ', 'ยังจะไม่ไปอีกเหรอ!!<br>แมวโมโหแล้วนะ 😾'];

let missBusy = false;
function miss() {   // the cat swings at the dodging button and misses: slash + sound, but no HP lost
  if (busy || missBusy) return; missBusy = true;
  setCat('attack'); pulse(cat, 'swing', 740);
  setTimeout(() => {
    if (busy) return;
    pulse(wrap, 'shake', 480); sfx.slash(); fullSlash(1);
    angerEl.style.fontSize = '24px'; pulse(angerEl, 'on', 720);
    const sl = document.createElement('div'); sl.className = 'slash'; sl.innerHTML = '<b></b><b></b>';
    card.appendChild(sl); setTimeout(() => sl.remove(), 900);
    if (navigator.vibrate) navigator.vibrate(40);
  }, 250);
  setTimeout(() => { if (!busy) setCat('idle'); missBusy = false; }, 900);
}
function home() {
  busy = false; setCat('idle'); hpRender();
  cat.style.setProperty('--sz', 1 + n * .03);
  const sNo = Math.max(.55, 1 - .13 * n), sYes = 1 + .05 * n;
  show(`<h1>ไปลอยกระทงด้วยกันไหม?</h1>
  <div class="btns"><button class="btn yes" data-act="yes" style="transform:scale(${sYes})">ไป ♡</button>
  <button class="btn no" id="noBtn" data-act="no" style="transform:scale(${sNo})">ไม่ไป</button></div>`, () => {
    const t0 = performance.now(), HOVER = matchMedia('(hover: hover) and (pointer: fine)').matches;   // desktop with a mouse
    card.onpointermove = null;
    if (n < 3 && !HOVER) return;                                        // from the 3rd round the "ไม่ไป" button dodges
    const nb = document.getElementById('noBtn'); let dodges = 0, lastD = 0;
    const mv = () => { dodges++; lastD = performance.now(); miss(); nb.style.transform = `translate(${(Math.random() - .5) * 110}px,${(Math.random() - .5) * 36}px) scale(${sNo})`; };
    if (HOVER) {                                              // desktop: just pointing at "ไม่ไป" gets you slashed
      card.onpointermove = e => {                             // from round 2 the button runs away from the cursor (3 times)
        if (busy || dodges >= 3 || performance.now() - t0 < 700 || performance.now() - lastD < 700) return;
        const r = nb.getBoundingClientRect();
        if (Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) < r.width * .9) mv();
      };
      nb.addEventListener('pointerenter', e => {
        if (e.pointerType === 'mouse' && !busy && performance.now() - t0 > 700 && dodges >= 3) sayNo();
      });
      return;
    }
    nb.addEventListener('pointerenter', () => { if (dodges < 3) mv(); });
    nb.addEventListener('click', e => { if (dodges < 3) { e.stopPropagation(); mv(); } });
  });
}
function fullSlash(k) {   // full-screen slash streaks that sweep across, then slowly fade out
  const fs = document.createElement('div'); fs.className = 'fs';
  const cnt = Math.min(1 + Math.ceil(k / 2), 4);
  for (let i = 0; i < cnt; i++) {
    const flip = i % 2 ? -1 : 1, y0 = 28 + Math.random() * 44, dy = flip * (16 + Math.random() * 26), my = y0 + dy / 2, w = 2.6 + Math.random() * 1.6;
    const d = document.createElement('div'); d.className = 'sl'; d.style.animationDelay = i * .1 + 's';
    d.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="-10,${y0} 50,${my - w} 110,${y0 + dy} 50,${my + w}" fill="#ffb3c9"/><polygon points="-10,${y0} 50,${my - w * .35} 110,${y0 + dy} 50,${my + w * .35}" fill="#fff"/></svg>`;
    fs.appendChild(d);
  }
  document.body.appendChild(fs); setTimeout(() => fs.remove(), 2000);
}
function sayNo() {
  if (busy) return; busy = true; n++; hp--;
  const i = n - 1;
  setCat('attack'); cat.style.setProperty('--sz', 1 + n * .05); pulse(cat, 'swing', 740);
  show(`<h1>${TRANSIENT[i]}</h1>`);
  setTimeout(() => {                                          // impact lands with the strike
    pulse(wrap, n >= 4 ? 'shake2' : 'shake', 620); sfx.slash(); fullSlash(n); hpRender(hp);
    if (navigator.vibrate) navigator.vibrate(n >= 4 ? [80, 40, 120] : 70);   // phone buzzes on the hit
    angerEl.style.fontSize = 22 + n * 7 + 'px'; pulse(angerEl, 'on', 720);
    const sl = document.createElement('div'); sl.className = 'slash'; sl.innerHTML = '<b></b><b></b>';
    card.appendChild(sl); setTimeout(() => sl.remove(), 900);
  }, 250);
  setTimeout(() => {
    setCat('idle');
    if (hp <= 0) { busy = false; sfx.over(); show(`<h1>GAME OVER</h1><div class="halfwrap"><span class="half l">ไม่</span><span class="half r">ไป</span></div>
      <p>ปุ่มไม่ไปถูกฟันขาดแล้ว…<br>เหลือทางเลือกเดียวนะ ♡</p><button class="btn yes" data-act="yes">ไป ♡</button>`); }
    else show(`<h1>${POPUP[i]}</h1><button class="btn yes" data-act="retry">ลองใหม่อีกครั้ง</button>`);
  }, 1700);
}
function sayYes() {
  if (busy) return; busy = true;
  setCat('happy'); cat.style.setProperty('--sz', 1); sfx.yes(); setTimeout(() => pulse(cat, 'jump', 1650), 200);
  for (let i = 0; i < 22; i++) setTimeout(heart, 200 + i * 130);
  show(`<h1>เย้! ไปด้วยกันแล้ว ♡</h1>
  <p>งั้นเตรียมตัวให้พร้อมนะ<br>เราไปลอยกระทงด้วยกันเลย!</p>
  <span class="pill">แล้วเจอกันวันลอยกระทงนะ ♡</span>
  <button class="link" data-act="again">เล่นอีกครั้ง</button>`);
}
function again() { n = 0; hp = MAXHP; home(); }
cat.addEventListener('click', () => {                          // poke the cat
  if (busy) return; pokes++; pulse(cat, 'boop', 320); sfx.poke();
  if (pokes % 10 === 0) { say('ลับๆ นะ… จริงๆ อยากไปด้วยมากเลย ♡', 2600); for (let i = 0; i < 8; i++) setTimeout(heart, i * 100); }
  else say(['อย่ามาจิ้ม!', 'เหม่ง!', 'จั๊กจี้นะ', 'หยุดนะ…', 'ฮึ่ม 😾', 'จิ้มอีกก็ฟันนะ!'][pokes % 6]);
});
function heart() {
  const h = document.createElement('span'); h.className = 'heart';
  h.textContent = Math.random() > .4 ? '♥' : '♡';
  h.style.left = Math.random() * 96 + 'vw'; h.style.fontSize = 16 + Math.random() * 22 + 'px';
  h.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
  h.style.animationDuration = 3 + Math.random() * 2.5 + 's';
  document.body.appendChild(h); setTimeout(() => h.remove(), 5800);
}
body.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  ({ yes: sayYes, no: sayNo, retry: home, again: again })[a.dataset.act]();
});

/* decorative background: tiny dots, sparkles, firework bursts */
(function () {
  const bg = document.getElementById('bg'), r = Math.random;
  const add = (cls, txt, w) => {
    const e = document.createElement('span'); e.className = cls;
    e.style.left = r() * 96 + '%'; e.style.top = r() * 96 + '%';
    e.style.animationDelay = r() * 4 + 's';
    if (txt) { e.textContent = txt; e.style.fontSize = 10 + r() * 12 + 'px'; }
    if (w) { e.style.width = e.style.height = w + 'px'; }
    bg.appendChild(e);
  };
  for (let i = 0; i < 30; i++) add('dot', '', 3 + r() * 4);
  for (let i = 0; i < 9; i++) add('spark', '✦');
  for (let i = 0; i < 4; i++) add('burst');
})();
home();
</script>
</body>
</html>
